<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech for Girls Registration</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>🚀 Tech for Girls: Registration</h1>

    <form id="registrationForm">
      <label>Name:
        <input type="text" name="name" required />
      </label>

      <label>Phone Number:
        <input type="number" name="phone" required />
      </label>

      <label>Email ID:
        <input type="email" name="email" required />
      </label>

      <label>College/Department:
        <input type="text" name="college" required />
      </label>

      <div class="share-section">
        <button type="button" id="shareBtn">📤 Share on WhatsApp</button>
        <p id="counterText">Click count: 0/5</p>
      </div>

      <label>Upload Screenshot:
        <input type="file" name="screenshot" id="screenshot" accept="image/*,application/pdf" required />
      </label>

      <button type="submit" id="submitBtn" disabled>✅ Submit Registration</button>
    </form>

    <p id="statusMessage"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
